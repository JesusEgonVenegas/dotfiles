# hypridle — idle daemon. Pairs with hyprlock.conf for the lock screen.
# Desktop machine on the NVIDIA proprietary driver, so:
#   - no backlight dimming (desktop monitors have no software backlight)
#   - auto-suspend is left OFF by default (NVIDIA desktop resume can be flaky);
#     uncomment the last listener if you want it.
# Manual lock stays on Ctrl+Alt+L (bound in hyprland.conf).

general {
    lock_cmd = pidof hyprlock || hyprlock       # never stack lockers
    before_sleep_cmd = loginctl lock-session    # lock before the system sleeps
    after_sleep_cmd = hyprctl dispatch dpms on  # make sure displays wake on resume
    ignore_dbus_inhibit = false                 # let mpv / browsers block idle during playback
}

# 5 min → lock the session (runs hyprlock via lock_cmd)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 7 min → turn the monitors off; any input wakes them
listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 min → suspend. OFF by default — uncomment if you want the box to sleep.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }

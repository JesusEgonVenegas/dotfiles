#####################
### LOOK AND FEEL ###
#####################

# Serial Experiments Lain — palette mirrors quickshell Theme.qml
# accent (phosphor green) #47F55B | accentAlt (amber) #FAB238 | bg #100F0E

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 16

    border_size = 2

    col.active_border = rgba(47F55Bee) rgba(FAB238bb) 45deg
    col.inactive_border = rgba(100F0E88)

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 6
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.88

    shadow {
        enabled = true
        range = 5
        render_power = 4
        color = rgba(0a0a0acc)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6
        passes = 2

        vibrancy = 0.20
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1
    # phosphor: fast snap in, slow phosphor decay out — like a CRT trace
    bezier = phosphor,0.05,0.9,0.1,1.0

    animation = global, 1, 10, default
    animation = border, 1, 8, phosphor
    animation = windows, 1, 3.5, easeOutQuint
    animation = windowsIn, 1, 3.2, phosphor, popin 82%
    animation = windowsOut, 1, 1.8, linear, popin 82%
    animation = fadeIn, 1, 1.5, phosphor
    animation = fadeOut, 1, 2.0, almostLinear
    animation = fade, 1, 2.5, quick
    animation = layers, 1, 3.0, easeOutQuint
    animation = layersIn, 1, 3.2, phosphor, fade
    animation = layersOut, 1, 1.8, linear, fade
    animation = fadeLayersIn, 1, 1.5, phosphor
    animation = fadeLayersOut, 1, 1.8, almostLinear
    animation = workspaces, 1, 2.5, phosphor, fade
    animation = workspacesIn, 1, 2.0, phosphor, fade
    animation = workspacesOut, 1, 2.5, almostLinear, fade
    animation = zoomFactor, 1, 5, quick
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = ctrl:nocaps
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
gestures {
    # workspace_swipe = false
}

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Escape, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, global, quickshell:clipboard  # clipboard history popup
bind = $mainMod, D, global, quickshell:launcher  # native Quickshell app launcher (was rofi)
bind = $mainMod SHIFT, P, pseudo, # dwindle
bind = $mainMod SHIFT, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, fullscreenstate, 0 2

# CUSTOM
bind = $mainMod SHIFT, I, global, quickshell:quickidea  # native quick-capture (was rofi quick-idea)
bind = $mainMod, C, global, quickshell:claude           # launcher in Claude mode (sessions + projects)
bind = $mainMod SHIFT, C, global, quickshell:calendar   # calendar / agenda / todos panel
bind = CTRL ALT, L, exec, hyprlock
bind = $mainMod, P, exec, ~/.config/hypr/scripts/toggle-secondary.sh  # disable/enable secondary monitor (HDMI-A-1)

# Screenshots — every capture saves to file AND copies to clipboard
bind = , Print, global, quickshell:screenshot                                    # themed Quickshell menu
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh region-quick     # region (no editor)
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot.sh region            # region → annotate (satty)
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh output        # fullscreen
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh window  # active window
bind = $mainMod CTRL, Print, exec, ~/.config/hypr/scripts/screenshot.sh output-annotate  # fullscreen → crop/annotate (hover-safe)
bind = ALT, Print, exec, ~/.config/hypr/scripts/screenshot.sh ocr                # OCR region → clipboard
bind = $mainMod ALT, Print, exec, ~/.config/hypr/scripts/screenshot.sh color     # pick colour → clipboard

# Screen recording
bind = $mainMod, R, global, quickshell:record                         # themed Quickshell record menu
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/record.sh stop  # stop recording (anytime)

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
# bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

bind = $mainMod, 1, exec, hyprspace $firstMonitor $secondMonitor switch 1
bind = $mainMod, 2, exec, hyprspace $firstMonitor $secondMonitor switch 2
bind = $mainMod, 3, exec, hyprspace $firstMonitor $secondMonitor switch 3
bind = $mainMod, 4, exec, hyprspace $firstMonitor $secondMonitor switch 4
bind = $mainMod, 5, exec, hyprspace $firstMonitor $secondMonitor switch 5

# bind = $mainMod, 1, split-workspace, 1
# bind = $mainMod, 2, split-workspace, 2
# bind = $mainMod, 3, split-workspace, 3
# bind = $mainMod, 4, split-workspace, 4
# bind = $mainMod, 5, split-workspace, 5

# bind = $mainMod, 1, exec, hyprsome workspace 1
# bind = $mainMod, 2, exec, hyprsome workspace 2
# bind = $mainMod, 3, exec, hyprsome workspace 3
# bind = $mainMod, 4, exec, hyprsome workspace 4
# bind = $mainMod, 5, exec, hyprsome workspace 5

# Move active window to a workspace with mainMod + SHIFT + [0-9]
# bind = $mainMod SHIFT, 1, movetoworkspace, 1
# bind = $mainMod SHIFT, 2, movetoworkspace, 2
# bind = $mainMod SHIFT, 3, movetoworkspace, 3
# bind = $mainMod SHIFT, 4, movetoworkspace, 4
# bind = $mainMod SHIFT, 5, movetoworkspace, 5
# bind = $mainMod SHIFT, 6, movetoworkspace, 6
# bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9
# bind = $mainMod SHIFT, 0, movetoworkspace, 10

# bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
# bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
# bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
# bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
# bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5

bind = $mainMod SHIFT, 1, exec, hyprspace $firstMonitor $secondMonitor move 1
bind = $mainMod SHIFT, 2, exec, hyprspace $firstMonitor $secondMonitor move 2
bind = $mainMod SHIFT, 3, exec, hyprspace $firstMonitor $secondMonitor move 3
bind = $mainMod SHIFT, 4, exec, hyprspace $firstMonitor $secondMonitor move 4
bind = $mainMod SHIFT, 5, exec, hyprspace $firstMonitor $secondMonitor move 5

# bind = $mainMod SHIFT, 1, exec, hyprsome move 1
# bind = $mainMod SHIFT, 2, exec, hyprsome move 2
# bind = $mainMod SHIFT, 3, exec, hyprsome move 3
# bind = $mainMod SHIFT, 4, exec, hyprsome move 4
# bind = $mainMod SHIFT, 5, exec, hyprsome move 5

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


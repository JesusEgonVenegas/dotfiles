# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=DP-1,1920x1080@165,1920x0,1
# AOC (secondary) is mostly off. It holds the HDMI connection alive even when
# powered down, so Hyprland can't tell it's off — it'd boot enabled and the
# cursor would escape into a dead region. Default it OFF; SUPER+P enables it
# (toggle-secondary.sh) on the rare occasion it's actually on.
monitor=HDMI-A-1,disable

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$fileManager = dolphin
$firstMonitor = DP-1
$secondMonitor = HDMI-A-1

##############################
###         PLUGINS        ###
##############################

plugin {
    # split-monitor-workspaces {
    #     count = 5
    #     keep_focused = true
    #     enable_notifications = false
    #     enable_persistent_workspaces = true
    # }
}

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = sleep 1 && hyprpm reload
exec-once = hyprpaper
# exec-once = waybar
exec-once = qs
exec-once = systemctl --user start hyprpolkitagent
# Clipboard: keep copies alive after the source app closes, + history via cliphist
exec-once = wl-clip-persist --clipboard regular
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# AOC follow: toggle secondary monitor in Hyprland when its power button is pressed
exec-once = ~/.config/hypr/scripts/monitor-hotplug.sh
# Idle daemon: auto-lock + screen-off (see hypridle.conf)
exec-once = hypridle
# Mic effects chain (rnnoise/gate/deesser/comp) -> "easyeffects_source".
# Must start before discord so the source exists when it enumerates devices.
# EasyEffects' own "autostart on login" writes an XDG ~/.config/autostart entry,
# which Hyprland never reads — hence starting it here instead.
exec-once = easyeffects --service-mode --hide-window
exec-once = [workspace 1 silent] librewolf
exec-once = [workspace 2 silent] foot
exec-once = [workspace 3 silent] discord
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
# exec-once = [workspace 4 silent] cider

# windowrulev2 = workspace 3 silent, class:^(discord)$

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = BROWSER,librewolf


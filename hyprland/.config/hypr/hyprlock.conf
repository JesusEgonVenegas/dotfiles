background {
    monitor =
    path = /home/kas/pictures/walls/lain2.png
    blur_passes = 4
    blur_size = 12
    noise = 0.035
    contrast = 0.80
    brightness = 0.45
    vibrancy = 0.05
}

# system label — ghost green, very quiet
label {
    monitor =
    text = [ KAS @ WIRED ]
    color = rgba(71, 245, 91, 0.45)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 148
    halign = center
    valign = center
}

# green rule
label {
    monitor =
    text = ────────────────────────────────────────────────────────────
    color = rgba(71, 245, 91, 0.18)
    font_size = 7
    font_family = JetBrainsMono Nerd Font
    position = 0, 126
    halign = center
    valign = center
}

# clock — warm cream, film title card weight
label {
    monitor =
    text = $TIME
    color = rgba(232, 228, 220, 1.0)
    font_size = 88
    font_family = JetBrainsMono Nerd Font ExtraLight
    shadow_passes = 2
    shadow_size = 14
    shadow_color = rgba(232, 228, 220, 0.10)
    shadow_boost = 1.1
    position = 0, 55
    halign = center
    valign = center
}

# date — amber, spaced uppercase
label {
    monitor =
    text = cmd[update:60000] date +"%A · %B %-d" | tr '[:lower:]' '[:upper:]'
    color = rgba(250, 178, 56, 0.65)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -14
    halign = center
    valign = center
}

# amber rule
label {
    monitor =
    text = ────────────────────────────────────────────────────────────
    color = rgba(250, 178, 56, 0.14)
    font_size = 7
    font_family = JetBrainsMono Nerd Font
    position = 0, -34
    halign = center
    valign = center
}

# password input — amber border, very dark fill
input-field {
    monitor =
    size = 280, 34
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.20
    dots_center = true
    outer_color = rgba(250, 178, 56, 0.28)
    inner_color = rgba(16, 15, 14, 0.85)
    font_color = rgba(250, 178, 56, 0.90)
    check_color = rgba(71, 245, 91, 0.80)
    fail_color = rgba(200, 60, 60, 1.0)
    fail_text = <i>$FAIL</i>
    fade_on_empty = true
    fade_timeout = 3000
    placeholder_text =
    rounding = 2
    position = 0, -106
    halign = center
    valign = center
}

# auth label — ghost green, barely there
label {
    monitor =
    text = AUTHENTICATE
    color = rgba(71, 245, 91, 0.30)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 0, -134
    halign = center
    valign = center
}
